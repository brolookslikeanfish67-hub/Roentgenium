name: Build PAK 3.x binaries

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-pak-3x-binaries-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.85.0"
  FIXTURE_BASE_URL: >-
    https://github.com/myfreeer/chrome-pak-customizer/releases/download/1.0

jobs:
  validate:
    name: Validate source and PAK round trips
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Thorium
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Download pinned PAK fixtures
        run: |
          mkdir -p pak-fixtures
          for fixture in \
            test_v4_474896_1.pak \
            test_v5_550886_1.pak \
            resources_99.0.4844.51-1.pak \
            msedge_100_percent.pak; do
            curl --fail --location --retry 3 \
              --output "pak-fixtures/$fixture" \
              "$FIXTURE_BASE_URL/$fixture"
          done
          (
            cd pak-fixtures
            printf '%s  %s\n' \
              '6f16e3d549e8a9dd0807f732fda78ed3d21aa59708f40385f2959c3b06da57f0' \
              'test_v4_474896_1.pak' \
              'aa4ea1a1f21bf06dbebe170fc4d9ed630561882bd5c2b00b7cd2bd88cd7262ba' \
              'test_v5_550886_1.pak' \
              '26210d4ce77155d2784474bfe0c54673123bcd28cf72f8f390ef674c1c996f41' \
              'resources_99.0.4844.51-1.pak' \
              'b3905c3b8afcd7929426261fffd0f33b2301b56e28b265802fe5d1ffe4923900' \
              'msedge_100_percent.pak' |
              sha256sum --check --strict
          )

      - name: Run Rust and round-trip tests
        run: |
          python3 pak_src/build.py test --keep-going \
            --fixture pak-fixtures/test_v4_474896_1.pak \
            --fixture pak-fixtures/test_v5_550886_1.pak \
            --fixture pak-fixtures/resources_99.0.4844.51-1.pak \
            --fixture pak-fixtures/msedge_100_percent.pak

      - name: Check Thorium CLI behavior
        run: |
          binary=pak_src/target/x86_64-unknown-linux-gnu/release/chrome-pak-customizer
          "$binary" -v | grep --fixed-strings 'Pak v3.0.0'
          "$binary" -h | grep --fixed-strings 'Chromium ASCII art'
          "$binary" -c | grep --fixed-strings 'Long Live Chromium!'
          if "$binary" >/dev/null 2>&1; then
            echo 'The no-argument invocation unexpectedly succeeded.' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" -eq 2

      - name: Upload pinned round-trip fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: round-trip-fixture
          path: pak-fixtures/test_v4_474896_1.pak
          if-no-files-found: error
          retention-days: 1

  linux-x64:
    name: Build Linux x64 musl
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Thorium
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Download round-trip fixture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: round-trip-fixture
          path: pak-fixtures

      - name: Install pinned Rust and musl toolchains
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --target x86_64-unknown-linux-musl
          rustup default "$RUST_VERSION"
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build and publish binary
        run: >-
          python3 pak_src/build.py package
          --target x86_64-unknown-linux-musl

      - name: Validate binary
        run: |
          binary=pak_src/binaries/pak
          "$binary" -v | grep --fixed-strings 'Pak v3.0.0'
          "$binary" -h | grep --fixed-strings 'Chromium ASCII art'
          file "$binary" | grep --extended-regexp 'x86-64.*(static|statically linked)'
          mkdir -p round-trip-linux-x64/unpacked
          "$binary" -u \
            pak-fixtures/test_v4_474896_1.pak \
            round-trip-linux-x64/unpacked
          "$binary" -p \
            round-trip-linux-x64/unpacked/pak_index.ini \
            round-trip-linux-x64/repacked.pak
          cmp --silent \
            pak-fixtures/test_v4_474896_1.pak \
            round-trip-linux-x64/repacked.pak
          mkdir pak-linux-x64
          cp "$binary" pak-linux-x64/pak
          {
            rustc --version --verbose
            cargo --version
            musl-gcc --version
          } > pak-linux-x64/linux-x64-toolchain.txt

      - name: Upload Linux x64 binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pak-linux-x64
          path: pak-linux-x64
          if-no-files-found: error
          retention-days: 14

  linux-arm64:
    name: Build Linux ARM64 musl
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Thorium
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Download round-trip fixture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: round-trip-fixture
          path: pak-fixtures

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Restore pinned cross binary
        id: cross-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cross
          key: >-
            cross-0.2.5-rust-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cross --version 0.2.5 --locked

      - name: Verify cached cross executable
        run: |
          cross_binary=$(command -v cross)
          test -n "$cross_binary"
          test -x "$cross_binary"
          sha256sum "$cross_binary"

      - name: Build ARM64 binary
        run: >-
          cross build
          --manifest-path pak_src/Cargo.toml
          --release
          --locked
          --target aarch64-unknown-linux-musl

      - name: Publish binary without rebuilding
        run: >-
          python3 pak_src/build.py package
          --target aarch64-unknown-linux-musl
          --source
          pak_src/target/aarch64-unknown-linux-musl/release/chrome-pak-customizer

      - name: Validate binary under cross
        run: |
          binary=pak_src/binaries/pak_arm64
          cmp --silent \
            pak_src/target/aarch64-unknown-linux-musl/release/chrome-pak-customizer \
            "$binary"
          cross run \
            --manifest-path pak_src/Cargo.toml \
            --release \
            --locked \
            --target aarch64-unknown-linux-musl \
            -- -v | grep --fixed-strings 'Pak v3.0.0'
          mkdir -p round-trip-linux-arm64/unpacked
          cross run \
            --manifest-path pak_src/Cargo.toml \
            --release \
            --locked \
            --target aarch64-unknown-linux-musl \
            -- -u \
            pak-fixtures/test_v4_474896_1.pak \
            round-trip-linux-arm64/unpacked
          cross run \
            --manifest-path pak_src/Cargo.toml \
            --release \
            --locked \
            --target aarch64-unknown-linux-musl \
            -- -p \
            round-trip-linux-arm64/unpacked/pak_index.ini \
            round-trip-linux-arm64/repacked.pak
          cmp --silent \
            pak-fixtures/test_v4_474896_1.pak \
            round-trip-linux-arm64/repacked.pak
          file "$binary" | grep --extended-regexp 'ARM aarch64.*(static|statically linked)'
          mkdir pak-linux-arm64
          cp "$binary" pak-linux-arm64/pak_arm64
          {
            rustc --version --verbose
            cargo --version
            printf '%s\n' 'cross 0.2.5 (pinned by workflow)'
            sha256sum "$(command -v cross)"
          } > pak-linux-arm64/linux-arm64-toolchain.txt

      - name: Upload Linux ARM64 binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pak-linux-arm64
          path: pak-linux-arm64
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows ${{ matrix.architecture }} MSVC
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
            output: pak_mingw64.exe
          - architecture: x86
            target: i686-pc-windows-msvc
            output: pak_mingw32.exe
    steps:
      - name: Check out Thorium
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Download round-trip fixture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: round-trip-fixture
          path: pak-fixtures

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION `
            --profile minimal `
            --target '${{ matrix.target }}'
          rustup default $env:RUST_VERSION

      - name: Build and publish binary
        shell: pwsh
        run: >-
          python pak_src/build.py package
          --target '${{ matrix.target }}'

      - name: Validate binary
        shell: pwsh
        run: |
          $binary = Resolve-Path 'pak_src/binaries/pak-win/${{ matrix.output }}'
          $version = & $binary -v
          if ($LASTEXITCODE -ne 0 -or ($version -join "`n") -notmatch '^Pak v3\.0\.0$') {
            throw "Unexpected version output: $version"
          }
          $help = & $binary -h
          if ($LASTEXITCODE -ne 0 -or
              ($help -join "`n") -notmatch 'Chromium ASCII art') {
            throw 'The generated binary did not produce the expected help.'
          }
          $fixture = Resolve-Path 'pak-fixtures/test_v4_474896_1.pak'
          $roundTrip = New-Item -ItemType Directory -Path 'round-trip-windows-${{ matrix.architecture }}'
          $unpacked = New-Item -ItemType Directory -Path ($roundTrip.FullName + '/unpacked')
          & $binary -u $fixture $unpacked.FullName
          if ($LASTEXITCODE -ne 0) {
            throw 'The generated binary failed to unpack the test fixture.'
          }
          $repacked = $roundTrip.FullName + '/repacked.pak'
          & $binary -p ($unpacked.FullName + '/pak_index.ini') $repacked
          if ($LASTEXITCODE -ne 0) {
            throw 'The generated binary failed to repack the test fixture.'
          }
          if ((Get-FileHash $fixture -Algorithm SHA256).Hash -ne
              (Get-FileHash $repacked -Algorithm SHA256).Hash) {
            throw 'The generated binary did not reproduce the test fixture.'
          }
          $stage = New-Item -ItemType Directory -Path `
            'pak-windows-${{ matrix.architecture }}'
          Copy-Item $binary ($stage.FullName + '/${{ matrix.output }}')
          $toolchain = $stage.FullName + '/windows-${{ matrix.architecture }}-toolchain.txt'
          rustc --version --verbose | Set-Content $toolchain
          cargo --version | Add-Content $toolchain

      - name: Upload Windows binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pak-windows-${{ matrix.architecture }}
          path: pak-windows-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14

  collect:
    name: Collect verified binaries
    needs:
      - linux-x64
      - linux-arm64
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pak-*
          path: collected
          merge-multiple: true

      - name: Validate and assemble final artifact
        run: |
          for file in \
            pak \
            pak_arm64 \
            pak_mingw32.exe \
            pak_mingw64.exe; do
            test -f "collected/$file"
          done
          test "$(find collected -maxdepth 1 -type f -name 'pak*' | wc -l)" -eq 4
          chmod 0755 collected/pak collected/pak_arm64
          file \
            collected/pak \
            collected/pak_arm64 \
            collected/pak_mingw32.exe \
            collected/pak_mingw64.exe \
            > collected/file-info.txt
          file collected/pak_mingw32.exe |
            grep --extended-regexp 'PE32 executable.*Intel 80386'
          file collected/pak_mingw64.exe |
            grep --extended-regexp 'PE32\+ executable.*x86-64'
          (
            cd collected
            sha256sum \
              pak \
              pak_arm64 \
              pak_mingw32.exe \
              pak_mingw64.exe \
              > SHA256SUMS
            tar \
              --sort=name \
              --mtime='UTC 1970-01-01' \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              --create --xz \
              --file thorium-pak-3x-binaries.tar.xz \
              pak \
              pak_arm64 \
              pak_mingw32.exe \
              pak_mingw64.exe \
              SHA256SUMS \
              file-info.txt
          )
          archive_test=$(mktemp --directory)
          trap 'rm -rf "$archive_test"' EXIT
          tar --extract --xz \
            --file collected/thorium-pak-3x-binaries.tar.xz \
            --directory "$archive_test"
          test "$(find "$archive_test" -maxdepth 1 -type f | wc -l)" -eq 6
          for file in \
            pak \
            pak_arm64 \
            pak_mingw32.exe \
            pak_mingw64.exe \
            SHA256SUMS \
            file-info.txt; do
            test -f "$archive_test/$file"
            cmp --silent "collected/$file" "$archive_test/$file"
          done
          test -x "$archive_test/pak"
          test -x "$archive_test/pak_arm64"
          (
            cd "$archive_test"
            sha256sum --check --strict SHA256SUMS
          )
          (
            cd collected
            sha256sum thorium-pak-3x-binaries.tar.xz \
              > thorium-pak-3x-binaries.tar.xz.sha256
          )
          rm -rf "$archive_test"
          trap - EXIT
          cat collected/file-info.txt
          cat collected/SHA256SUMS
          cat collected/thorium-pak-3x-binaries.tar.xz.sha256

      - name: Upload complete PAK binary set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thorium-pak-3x-binaries
          path: collected
          if-no-files-found: error
          retention-days: 14
