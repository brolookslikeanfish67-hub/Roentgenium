name: Generate macOS app icon

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-macos-app-icon
  cancel-in-progress: false

jobs:
  generate:
    runs-on: macos-26
    # Keep this synchronized with build/config/mac/mac_sdk.gni when updating
    # the Chromium branch.
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Check out Thorium
        uses: actions/checkout@v4

      - name: Install SVG renderer
        run: brew install imagemagick librsvg

      - name: Generate icon resources
        run: >-
          python3 logos/NEW/mac/gen/build_app_icon.py
          --minimum-deployment-target "$MACOSX_DEPLOYMENT_TARGET"

      - name: Collect generated resources
        run: |
          mkdir macos-app-icon
          cp src/chrome/app/theme/chromium/mac/Assets.car macos-app-icon/
          cp src/chrome/app/theme/chromium/mac/app.icns macos-app-icon/
          cp -R \
            src/chrome/app/theme/chromium/mac/Assets.xcassets/Icon.iconset \
            macos-app-icon/DocumentBadge.iconset
          iconutil -c iconset \
            src/chrome/app/theme/chromium/mac/app.icns \
            -o macos-app-icon/Thorium.iconset
          xcrun assetutil --info \
            src/chrome/app/theme/chromium/mac/Assets.car \
            > macos-app-icon/Assets.car.info.json
          (
            cd macos-app-icon
            shasum -a 256 \
              Assets.car \
              app.icns \
              DocumentBadge.iconset/icon_256x256.png \
              DocumentBadge.iconset/icon_256x256@2x.png \
              > SHA256SUMS
          )
          file \
            macos-app-icon/Assets.car \
            macos-app-icon/app.icns \
            macos-app-icon/DocumentBadge.iconset/*.png \
            macos-app-icon/Thorium.iconset/*.png \
            > macos-app-icon/file-info.txt
          {
            printf '%s\n' '=== macOS ==='
            sw_vers
            printf '%s\n' '=== Xcode ==='
            xcodebuild -version
            printf '%s\n' '=== actool ==='
            xcrun actool --output-format=xml1 --version
            printf '%s\n' '=== librsvg ==='
            rsvg-convert --version
            printf '%s\n' '=== ImageMagick ==='
            magick -version
            printf '%s\n' '=== Python ==='
            python3 --version
          } > macos-app-icon/tool-versions.txt 2>&1

      - name: Upload generated resources
        uses: actions/upload-artifact@v4
        with:
          name: thorium-macos-app-icon
          path: macos-app-icon
          if-no-files-found: error
